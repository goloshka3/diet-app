<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホで見たときに拡大されず、画面幅に合わせて表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>食事記録</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍽️ 食事記録</h1>
    <p class="sub">食べたものを記録して、栄養の合計・不足を確認する</p>
  </header>

  <main>
    <!-- 設定（ふだんは閉じている。クリックで開く） -->
    <details class="settings">
      <summary>⚙️ 設定</summary>

      <h3 class="settings-h">あなたの条件（目標値の基準）</h3>
      <div class="field">
        <label for="pf-sex">性別</label>
        <select id="pf-sex">
          <option value="male">男性</option>
          <option value="female_yes">女性（月経あり）</option>
          <option value="female_no">女性（月経なし・閉経後）</option>
        </select>
      </div>
      <div class="field">
        <label for="pf-age">年齢層</label>
        <select id="pf-age">
          <option value="18-29">18〜29歳</option>
          <option value="30-49">30〜49歳</option>
          <option value="50-64">50〜64歳</option>
          <option value="65+">65歳以上</option>
        </select>
      </div>
      <div class="field">
        <label for="pf-activity">活動レベル</label>
        <select id="pf-activity">
          <option value="low">低い（座り仕事中心）</option>
          <option value="mid">ふつう（通勤・家事・軽い運動）</option>
          <option value="high">高い（立ち仕事・よく動く）</option>
        </select>
      </div>
      <div class="field">
        <label for="pf-kcal">カロリー目標（空欄で自動計算）</label>
        <input type="number" id="pf-kcal" min="0" step="10" inputmode="decimal" placeholder="自動">
      </div>
      <div class="field">
        <label for="pf-protein">たんぱく質目標 g（空欄で自動）</label>
        <input type="number" id="pf-protein" min="0" step="1" inputmode="decimal" placeholder="自動">
      </div>
      <button type="button" id="pf-save">この条件で保存</button>
      <p class="hint" id="pf-status"></p>

      <h3 class="settings-h">Claude API キー（成分表のAI読み取り用）</h3>
      <div class="field">
        <label for="api-key-input">API キー</label>
        <div class="key-row">
          <input type="password" id="api-key-input" placeholder="sk-ant-...">
          <button type="button" id="api-key-toggle">表示</button>
        </div>
      </div>
      <p class="hint">
        このブラウザの中だけに保存されます（コードやサーバーには送られません）。
        キーは <a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a> で取得・無効化できます。
      </p>
      <button type="button" id="api-key-save">保存</button>
      <p class="hint" id="api-key-status"></p>

      <h3 class="settings-h">データのバックアップ</h3>
      <p class="hint">
        記録をファイルに書き出し／読み込みできます。Safari のデータ消去で記録が
        消えることがあるので、ときどき書き出しておくと安心です。
      </p>
      <button type="button" id="export-btn">書き出す（エクスポート）</button>
      <button type="button" id="import-btn">読み込む（インポート）</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <p class="hint" id="backup-status"></p>
    </details>

    <!-- 入力フォーム -->
    <form id="add-form">
      <div class="field">
        <label for="date-input">日付</label>
        <input type="date" id="date-input" required>
      </div>
      <div class="field">
        <label for="barcode-input">バーコード番号 または 商品名で検索</label>
        <div class="barcode-row">
          <input type="text" id="barcode-input" placeholder="例: 4901234567890 / チョコレート">
          <button type="button" id="barcode-search">検索</button>
        </div>
        <button type="button" id="scan-open" class="scan-open-btn">📷 バーコードをカメラで読み取る</button>
        <button type="button" id="ai-read" class="scan-open-btn">🧠 成分表を撮ってAIで読み取り</button>
        <input type="file" id="ai-photo" accept="image/*" capture="environment" hidden>
        <p class="hint" id="barcode-status"></p>
        <div id="search-results"></div>
      </div>

      <div class="field">
        <label for="food-select">食品を選ぶ（栄養を自動入力）</label>
        <select id="food-select">
          <option value="">— 一覧から選ぶ —</option>
        </select>
      </div>

      <div class="field">
        <label for="food-input">食べたもの</label>
        <input type="text" id="food-input" placeholder="例: 納豆ごはん、みそ汁" required>
      </div>

      <div class="field">
        <label for="amount-input">食べた量（表示の何倍か。変えると下の栄養も変わる）</label>
        <input type="number" id="amount-input" min="0" step="0.1" inputmode="decimal" value="1">
      </div>

      <!-- 基本の栄養欄。中身は app.js が NUTRIENTS から作る -->
      <div class="nutrients" id="nutrients-basic"></div>

      <details class="nutrients-more">
        <summary>詳細な栄養（ビタミン・ミネラルなど）</summary>
        <div class="nutrients" id="nutrients-detail"></div>
      </details>

      <p class="hint">栄養は分かる範囲でOK。空欄は 0 として扱います。</p>

      <button type="submit">追加する</button>
    </form>

    <!-- 記録の一覧。中身は app.js が作って差し込む -->
    <section id="log-list"></section>
  </main>

  <!-- カメラ映像を出すための全画面オーバーレイ（ふだんは hidden で非表示） -->
  <div id="scanner-overlay" hidden>
    <div class="scanner-box">
      <div id="scanner-view"></div>
      <button type="button" id="scan-close">閉じる</button>
    </div>
  </div>

  <!-- バーコード読み取りライブラリ（外部・CDNから1ファイル読み込み） -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- データの定義ファイルを先に読み込む（app.js がこれらの中身を使うため） -->
  <script src="foods.js"></script>
  <script src="standards.js"></script>
  <script src="suggestions.js"></script>
  <script src="app.js"></script>
</body>
</html>
