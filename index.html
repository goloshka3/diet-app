<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホで見たときに拡大されず、画面幅に合わせて表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>食事記録</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍽️ 食事記録</h1>
    <p class="sub">食べたものを記録して、栄養の合計・不足を確認する</p>
  </header>

  <main>
    <!-- 設定（ふだんは閉じている。クリックで開く） -->
    <details class="settings">
      <summary>⚙️ 設定（AI読み取り用）</summary>
      <div class="field">
        <label for="api-key-input">Claude API キー</label>
        <div class="key-row">
          <input type="password" id="api-key-input" placeholder="sk-ant-...">
          <button type="button" id="api-key-toggle">表示</button>
        </div>
      </div>
      <p class="hint">
        このブラウザの中だけに保存されます（コードやサーバーには送られません）。
        キーは <a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a> で取得・無効化できます。
      </p>
      <button type="button" id="api-key-save">保存</button>
      <p class="hint" id="api-key-status"></p>
    </details>

    <!-- 入力フォーム -->
    <form id="add-form">
      <div class="field">
        <label for="date-input">日付</label>
        <input type="date" id="date-input" required>
      </div>
      <div class="field">
        <label for="barcode-input">バーコード番号 または 商品名で検索</label>
        <div class="barcode-row">
          <input type="text" id="barcode-input" placeholder="例: 4901234567890 / チョコレート">
          <button type="button" id="barcode-search">検索</button>
        </div>
        <button type="button" id="scan-open" class="scan-open-btn">📷 バーコードをカメラで読み取る</button>
        <button type="button" id="ai-read" class="scan-open-btn">🧠 成分表を撮ってAIで読み取り</button>
        <input type="file" id="ai-photo" accept="image/*" capture="environment" hidden>
        <p class="hint" id="barcode-status"></p>
        <div id="search-results"></div>
      </div>

      <div class="field">
        <label for="food-select">食品を選ぶ（栄養を自動入力）</label>
        <select id="food-select">
          <option value="">— 一覧から選ぶ —</option>
        </select>
      </div>

      <div class="field">
        <label for="food-input">食べたもの</label>
        <input type="text" id="food-input" placeholder="例: 納豆ごはん、みそ汁" required>
      </div>

      <div class="field">
        <label for="kcal-input">カロリー (kcal)</label>
        <input type="number" id="kcal-input" min="0" step="1" inputmode="decimal" placeholder="0">
      </div>

      <!-- 栄養の欄。2列に並べる（CSS で指定） -->
      <div class="nutrients">
        <div class="field">
          <label for="protein-input">たんぱく質 (g)</label>
          <input type="number" id="protein-input" min="0" step="0.1" inputmode="decimal" placeholder="0">
        </div>
        <div class="field">
          <label for="fat-input">脂質 (g)</label>
          <input type="number" id="fat-input" min="0" step="0.1" inputmode="decimal" placeholder="0">
        </div>
        <div class="field">
          <label for="carb-input">炭水化物 (g)</label>
          <input type="number" id="carb-input" min="0" step="0.1" inputmode="decimal" placeholder="0">
        </div>
        <div class="field">
          <label for="fiber-input">食物繊維 (g)</label>
          <input type="number" id="fiber-input" min="0" step="0.1" inputmode="decimal" placeholder="0">
        </div>
        <div class="field">
          <label for="iron-input">鉄 (mg)</label>
          <input type="number" id="iron-input" min="0" step="0.1" inputmode="decimal" placeholder="0">
        </div>
        <div class="field">
          <label for="calcium-input">カルシウム (mg)</label>
          <input type="number" id="calcium-input" min="0" step="1" inputmode="decimal" placeholder="0">
        </div>
      </div>

      <p class="hint">栄養は分かる範囲でOK。空欄は 0 として扱います。</p>

      <button type="submit">追加する</button>
    </form>

    <!-- 記録の一覧。中身は app.js が作って差し込む -->
    <section id="log-list"></section>
  </main>

  <!-- カメラ映像を出すための全画面オーバーレイ（ふだんは hidden で非表示） -->
  <div id="scanner-overlay" hidden>
    <div class="scanner-box">
      <div id="scanner-view"></div>
      <button type="button" id="scan-close">閉じる</button>
    </div>
  </div>

  <!-- バーコード読み取りライブラリ（外部・CDNから1ファイル読み込み） -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <!-- データの定義ファイルを先に読み込む（app.js がこれらの中身を使うため） -->
  <script src="foods.js"></script>
  <script src="standards.js"></script>
  <script src="suggestions.js"></script>
  <script src="app.js"></script>
</body>
</html>
